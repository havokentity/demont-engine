#
# #317 regression fixture: the DEFAULT planet from orbit WITH the sea.
#
# The A/B sibling of planet_land_orbit.cfg. That cell pins the land cover
# with r_planet_ocean 0, precisely so the specular sea does not perturb the
# land-colour measurement -- which means it dodges the exact configuration
# every cold start ships: terrain + ground + ocean all on. #317 was a
# waterworld in that configuration (the sea-level shell covered the whole
# globe and no land was visible) and NO golden exercised it, which is how it
# shipped uncaught. This cell is that golden.
#
# WHAT IT PINS. The whole illuminated disc must show LAND and SEA at once:
#   * the continents read as land cover (green monsoon belts, tan Arabia)
#     because the ocean shell defers to the land/sea mask over land;
#   * the oceans read as deep water because the shell IS drawn over sea;
#   * the boundary between them is the DEM/geoid-zero land mask (coverage
#     >= 0.5), the same curve the land albedo flips on.
# A regression to the waterworld (all sea, no land) or to land-with-no-sea
# both move this frame -- proven by the ablations in tests/CMakeLists.txt.
#
# ONLY r_planet_ocean DIFFERS FROM planet_land_orbit. Same camera, site,
# sky, sun, terrain, raster, frame count. So the imgdiff between the two
# committed goldens IS the ocean shell's contribution, and #317 is the
# difference between them.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

# 30 000 km straight down over the site: the whole illuminated disc in a
# 40-degree field. Identical to planet_land_orbit.
cam_pos 0 30000000 0
r_planet_stand_eye -1
cam_yaw 0
cam_pitch -90
cam_fov 40

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_site_lat 27.9881
r_planet_site_lon 86.9250
r_planet_lod_error_px 1.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 13
r_planet_chunk_budget 2048
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

# Land cover, stated rather than inherited.
r_planet_albedo_map assets/planet/earth_lite.ptalb
r_planet_land_albedo 1
r_planet_snowline 4900

# The seabed backstop colour the analytic body carries where the shell is
# drawn over it -- deep water's measured 0.06 (Budyko 1974). Mostly hidden
# behind the sea here (the shell wins over ocean coverage), but stated for
# parity with the sibling and because it is the right value for the surface
# beneath the water.
r_planet_ground_albedo 0.06

# THE ONE LINE THAT DIFFERS FROM planet_land_orbit: the sea is ON. This is
# the shell #259 placed at the sea-level radius and #317 taught to defer to
# the land/sea mask over land.
r_planet_ocean 1

# The shell's water, stated rather than inherited so the golden does not
# move if a default does. These are the engine defaults the earth seed
# already runs with: clear open-ocean absorption (Pope and Fry 1997, as
# the r_water_absorption_* docstrings cite), a 1.33 interface, and a
# 12 m/s wind driving the Cox and Munk 1954 slope the shell reads from
# orbit. The FFT cascades stay OFF (r_ocean 0): at 2 km/pixel from
# 30 000 km every cascade is sub-pixel, so the shell is the analytic
# Cox-Munk surface exactly as planet_ocean_orbit documents.
r_ocean 0
r_ocean_wind_speed 12
r_water_absorption_r 0.2755
r_water_absorption_g 0.0565
r_water_absorption_b 0.00922
r_water_ior 1.33

# Sun overhead at the site, so land cover and sea colour -- not the shading
# cosine -- vary across the disc. Same procedural dome as planet_land_orbit
# (space is not black under it and there is no aerial perspective at this
# altitude, both documented on the sibling and both the sky mode, not the
# ocean); switching to physical is its own change and is scoped out here so
# this stays a clean one-variable A/B with planet_land_orbit.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 90
r_sun_azimuth 0

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Re-derived for the sea, NOT inherited from planet_land_orbit's 0.05 -- the
# ocean changes the frame's luminance distribution. Land soil chroma falls
# with exposure while sea blue rises, so 0.08 is the balance point (the two
# separations' normalised minimum is maximised there), on the distinct-level
# plateau, nothing clipped. See the exposure sweep in tests/CMakeLists.txt.
r_exposure 0.08
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
