#
# Planetary P5 (#259) acceptance fixture: the same ocean from 400 km.
#
# The other end of the headline claim, and the scale counterpart to
# planet_ocean_boat.cfg. Same engine, same shell, same cascades, same ray
# query -- the ONLY difference between the two cells is where the camera is,
# and therefore how wide the ray cone is when it lands on the water. There is
# no second code path for "orbit mode" and no altitude anywhere in the
# shading, and that is the claim this pair exists to pin.
#
# WHAT SHOULD BE VISIBLE. A broad sun-glitter patch, tens of degrees across,
# which is what an ocean looks like from space and is the single most
# recognisable feature of one in a satellite photo. NOT a pinpoint mirror
# image of the sun -- that is what a specular surface with no wave slope
# does, and it is what this frame rendered before the roughness fold existed.
#
# THE CONTROL IS ITS OWN CELL. planet_ocean_orbit_smooth.cfg is this scene
# with r_ocean 0: the cascades never run, the geometry carries no slope, and
# the BRDF therefore carries ALL of Cox & Munk's measured sigma^2 at every
# distance. The two must agree -- that is #259's stated acceptance criterion
# and it is registered as an imgdiff pair, not as an eyeball comparison.
# Measured on the dev M4 Max: max delta 2.45, mean 0.25, on a frame whose own
# glitter patch spans 156 levels.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

# The planet IS the scene, but only the water half of it.
r_scene_default earth
pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 0
r_planet_ocean 1
r_planet_radius 6371008.8

# 400 km: the altitude of the International Space Station, and the altitude
# the roadmap's headline climb ends at. Pitched 60 degrees down so the
# specular point sits inside the frame rather than beyond the limb.
cam_pos 0 400000 0
cam_yaw 0
cam_pitch -60
cam_fov 60

# The sun 60 degrees up, so the specular point is under the camera and the
# glitter patch is the subject of the frame. At this footprint -- 2 460 m per
# pixel -- every cascade is unresolved and alpha^2 is exactly Cox & Munk's
# sigma^2 for 12 m/s, i.e. alpha 0.2539, i.e. an engine roughness of 0.5038.
r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 60
r_sun_azimuth 0

# The atmosphere at its real P3 settings, stated rather than inherited.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

# The FFT. 12 m/s is a fresh breeze (Beaufort 6) and is the wind Cox & Munk's
# sigma^2 = 0.003 + 0.00512 U is quoted at throughout this phase.
r_ocean 1
r_ocean_wind_speed 12
r_ocean_wind_dir_deg 0
r_ocean_choppiness 1.0
r_ocean_grid_size 256
r_ocean_march_steps 64
r_ocean_foam_amount 1.0

# Open-ocean absorption: blue-green, red gone within a couple of metres.
r_water_absorption_r 0.40
r_water_absorption_g 0.10
r_water_absorption_b 0.05
r_water_ior 1.33

r_spp 2
r_max_bounces 3
r_firefly_clamp 8
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.15

r_env_map ""
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
