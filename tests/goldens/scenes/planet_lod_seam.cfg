#
# Planetary P4 (#258) acceptance fixture: a watertight surface across a
# forced LOD boundary.
#
# The camera sits 900 m up looking out at 20 degrees, so the ground in
# frame runs from 2.6 km to the horizon at 107 km -- a 40x distance range,
# which the split rule turns into five or six LOD levels ACROSS ONE FRAME.
# Every boundary between them is a place a crack could be.
#
# tau is raised to 2 px, four times the shipping default. At the default
# 0.5 px every transition is sub-pixel and a crack would be invisible in a
# golden even if one existed, which makes the default a bad place to look
# for cracks. At 2 px the geometric step at each boundary is four times
# larger -- and a genuine crack is not a subtle thing anyway: it shows the
# sky, or the backstop body 27 km below, through a slit.
#
# Raising tau further does NOT help, which is worth recording: past about
# 4 px the whole visible ground merges into one or two chunks and there are
# no boundaries left in frame to inspect. The useful setting is the one
# that keeps many levels visible at once.
#
# NOTE ON WHAT A PNG CAN AND CANNOT SETTLE. This cell shows that ONE camera
# saw no crack. The general claim -- that two chunks at any two levels
# sharing an edge produce bit-identical vertex positions, on every one of
# the 12 cube seams -- is an equality over the whole domain and is asserted
# in tests/pt_planet_terrain_test.cpp instead. The two are complementary:
# the unit test proves the property, this cell proves it reached the screen.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

cam_pos 0 900 0
cam_yaw -90
cam_pitch -20
cam_fov 60

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_lod_error_px 2.0
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 15
# The shipping-ish budget: enough chunks that several levels coexist.
r_planet_chunk_budget 512
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle 400

# High sun, so a crack shows as brightness rather than hiding in shadow.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 70
r_sun_azimuth 180

# Atmosphere off: haze is exactly what would hide a one-pixel seam, and
# this cell exists to see one.
r_volumetric 0
r_clouds 0
r_fog 0

r_spp 2
r_max_bounces 1
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.15

r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
