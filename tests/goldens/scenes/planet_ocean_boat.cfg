# Planetary P5 (#259) acceptance fixture: the ocean from a boat.
#
# One end of the phase's headline claim -- "reads as water from a boat AND as
# a smooth specular sphere from orbit, with no visible transition between
# them". This is the water end. What this cell pins:
#
#   * that a MAT_WATER SHELL exists at all -- the first frame in this
#     engine's history where water is a body on a planet rather than an
#     infinite plane at y = 0
#   * that the three band-limited FFT cascades reach the screen through the
#     stacked atlas, at three scales, in a camera-anchored tangent frame
#   * that the specular sun NEE puts a glitter path on the water instead of
#     leaving it to a VNDF sample landing on a 0.53-degree disc
#   * that the radial ray-march finds the displaced surface -- the crests
#     have silhouettes against the sky, which a normal map cannot produce
#
# NO TERRAIN, DELIBERATELY. r_planet_terrain 0 and r_planet_ground 0: the
# planet IS the ocean here. That is not a shortcut, it is what isolates the
# phase -- with the analytic backstop on it would sit at the SAME radius as
# the shell and the two would fight for every pixel, and with terrain on the
# cell would be pinning P4's streaming determinism a second time. It also
# means this cell needs no settle barrier and no r_planet_lod_freeze, so it
# is bit-reproducible without any of #284's machinery.
#
# THE SEA IS NOT AN AMPLITUDE DIAL. r_ocean_amplitude does not appear below,
# and setting it would do nothing here: the planetary cascades take their
# amplitude from Cox & Munk's measured slope variance at r_ocean_wind_speed
# through the Phillips equilibrium range, because a dimensionless dial does
# not survive contact with three tile sizes. See the "ocean: cascades ..."
# line the engine logs once per spectrum.
#
# Parser-safety: no semicolons or backticks anywhere in this file, comments
# included. The console splits scripts on both newline AND semicolon.

app_window_width 512
app_window_height 384

# The planet IS the scene, but only the water half of it.
r_scene_default earth
pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 0
r_planet_ocean 1
r_planet_radius 6371008.8

# Three metres over the water -- a small boat's deck, above the 5 m summed
# crest peak the three cascades reach at this wind so the surface reads as a
# sea rather than as the inside of a trough. Pitched down 8 degrees so the
# near field, the glitter path and the horizon are all in frame.
cam_pos 0 3.0 0
cam_yaw 0
cam_pitch -8
cam_fov 60

# Golden hour. The sun 8 degrees up and dead ahead puts the specular path
# straight down the middle of the frame, which is where the geometry-to-BRDF
# handover is visible: the near crests resolve it, the far ones do not.
r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 8
r_sun_azimuth 0

# The atmosphere at its real P3 settings, stated rather than inherited.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

# The FFT. 12 m/s is a fresh breeze (Beaufort 6) and is the wind Cox & Munk's
# sigma^2 = 0.003 + 0.00512 U is quoted at throughout this phase.
r_ocean 1
r_ocean_wind_speed 12
r_ocean_wind_dir_deg 0
r_ocean_choppiness 1.0
r_ocean_grid_size 256
r_ocean_march_steps 64
r_ocean_foam_amount 1.0

# Open-ocean absorption: blue-green, red gone within a couple of metres.
r_water_absorption_r 0.40
r_water_absorption_g 0.10
r_water_absorption_b 0.05
r_water_ior 1.33

r_spp 2
r_max_bounces 3
r_firefly_clamp 8
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.15

r_env_map ""
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
