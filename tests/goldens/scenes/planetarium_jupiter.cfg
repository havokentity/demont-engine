#
# Golden-image regression matrix -- planetarium (issue #281).
#
# Jupiter in Gemini, framed against the Bright Star Catalog. Exercises:
#   * pt::astro::planetPosition -> equatorialToHorizon -> world direction
#   * the two float4[7] planet push arrays in StarsCompositePush
#   * StarsComposite.slang's planetSplat(), including the day fade and the
#     4-sigma Gaussian truncation
#   * the SHARED magnitude scale: Jupiter (V = -2.67) in the same frame as
#     Pollux (V = 1.14) and Castor (V = 1.58) from the star catalogue, so
#     the golden pins the relative brightness of a planet against real
#     stars, not just the planet's presence
#
# BACKEND NOTE. This is a Metal-only cell on purpose. The planets exist
# only in StarsComposite.slang, which the software tracer does not run --
# SoftwareTracer.cpp is hand-written C++, explicitly "not a Slang-to-CPU
# emit" (see #263) -- so a software cell here would pin a planet-free image
# and pass forever, which is exactly the failure mode #257 caught with the
# three unregistered sunset_* fixtures.
#
# WHY THIS DATE AND POSE. 2026-01-01 16:00 UTC at Chennai (the engine's
# default observer) puts:
#   sun     alt -50.2  -- deep night, no twilight wash
#   jupiter alt  40.7  az  72.0   V = -2.67   RA 112.64  Dec +22.05
# which is in Gemini, a few degrees from Castor and Pollux. cam_yaw /
# cam_pitch below are that az / alt. Engine yaw convention: 0 = north (-Z),
# 90 = east (+X), matching the astronomy azimuth (0=N, 90=E); pitch is
# altitude. If the date changes, re-run `dump_planet_pos` and re-aim.
#
# Parser caveat: console splits on newline and semicolon even inside
# comments. ASCII only.

app_window_width 512
app_window_height 384

cam_pos 0 1.5 4
cam_yaw 72.03
cam_pitch 40.73
cam_fov 60

# Sky: procedural, astronomical, date pinned. Astronomical mode is
# REQUIRED for planets (a planet position is meaningless without a real
# date and observer) -- with it off the engine pushes planet_count 0 and
# this cell would render an empty sky.
r_sky_mode procedural
r_sky_use_astronomical 1
r_sky_year 2026
r_sky_month 1
r_sky_day 1
r_sky_hour 16
r_sky_hour_local 0

# Bright Star Catalog on, and the star-split composite that carries both
# the stars and the planets. r_star_split 0 would silently drop the
# planets along with the post-denoise star path.
r_stars_mode bsc
r_star_split 1
r_stars_aperture_samples 16
# Twinkle off. Planets famously do NOT twinkle -- they are extended
# sources, so atmospheric cells average out across the disc -- and the
# engine's twinkle is a starmap-sample modulation that planets do not go
# through anyway. Turning it off keeps the golden free of the frame-index
# dependence twinkle introduces.
r_stars_twinkle 0

# Planets. Defaults except the magnitude limit, which is raised so the
# cvar is exercised past its default and Uranus / Neptune are eligible
# (both are out of frame at this pose; the point is that the limit is a
# live filter, not that they are visible here).
r_planets 1
r_planets_mag_limit 8.0
r_planets_brightness 1.0
r_planets_size 1.0

r_spp 1
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_refract_bounces 1
r_accum_ema_alpha 0
r_svgf_atrous_passes 3
r_hdr_pipeline 1

# Manual exposure boosted for night, same as bsc_night.
r_auto_exposure 0
r_exposure 1.5

r_bloom 1
r_lens_flare 0

# Moon disc dimmed to zero: the moon is at alt 70.5 az 38.3 for this
# instant, close enough to the frame edge that its halo would compete
# with the point sources this cell is about. Its astronomical position
# and NEE are unaffected, and the camera is pitched 40 deg up with the
# ground out of frame so moon NEE cannot land on a visible pixel.
r_moon_disc_brightness 0
r_dof 0
r_clouds 0

r_capture_format png
r_capture_seed 1
