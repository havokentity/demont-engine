#
# Planetary P7 (#261): the water column, which did not exist before this
# phase.
#
# WHAT THIS CELL PINS. Before P7 every one of the three air marches was
# gated off by !primary_in_water with NOTHING replacing it, so a submerged
# frame was pure exponential darkening -- absorption with no scattering.
# That renders as tinted glass. What should be visible here is the other
# half: a blue glow that builds with distance through the column, Snell's
# window compressed into its 97.5-degree cone overhead, total internal
# reflection outside it, and the seabed-less deep-water void below.
#
# THE ABSORPTION IS DELIBERATELY NOT SET. Every other water fixture in the
# matrix overrides r_water_absorption_*; this one does not, so it renders on
# the engine's DEFAULTS -- which as of this phase are Pope & Fry 1997's
# measured pure-water coefficients at 620 / 550 / 450 nm rather than the
# authored (0.45, 0.15, 0.05). If those defaults ever drift back to a
# hand-picked triple this cell moves, which is the point: the acceptance
# criterion is about a MEASUREMENT reaching the screen.
#
# THE SCATTERING IS PURE SEAWATER TOO. r_water_scatter_particulate stays at
# its 0.0 default, so the only in-scatter here is Morel 1974's molecular
# term with its near-symmetric depolarised-Rayleigh phase. That is the
# harder case to get right and the one that carries the acceptance claim:
# pure water's blue scatter is why a clear ocean is blue rather than merely
# dark, and a single forward HG lobe for both species would erase it.
#
# THIRTY METRES, NOT TWELVE. planet_ocean_snell sits at 12 m with the
# absorption dialled down an order of magnitude so the window reads as a
# refracted sky. This cell is the complement: real coefficients, deep enough
# that the column is doing most of the work. At 30 m of pure seawater the
# transmittances are 2.5e-4 / 0.176 / 0.663 -- red is entirely gone, green
# is a fifth left, blue is two thirds. That IS the hue shift, in one frame.
#
# NO TERRAIN, for planet_ocean_boat's reasons: the planet is the ocean here,
# so the cell needs no settle barrier and no r_planet_lod_freeze and is
# bit-reproducible without any of #284's machinery.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth
pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 0
r_planet_ocean 1
r_planet_radius 6371008.8

# Thirty metres down, pitched up 60 degrees so the window sits high in frame
# with the total-internal-reflection region and the deep-water void beneath
# it. A 90-degree lens holds the 97.5-degree window slightly cropped, which
# is what puts the rim inside the frame rather than at its corners.
cam_pos 0 -30.0 0
cam_yaw 0
cam_pitch 60
cam_fov 90

r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 60
r_sun_azimuth 0

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

# THE FFT IS ON, AND IT ONLY IS BECAUSE #296 LANDED. With r_ocean 1 this
# cell was racing before that fix: Engine::EnsureOceanUploaded s upload ring
# was outrun because nothing bounded Metal s frames in flight, and this
# fixture -- whose in-scatter march makes the frame slow enough for the CPU
# to run well ahead -- showed it worse than anything in the matrix.
# MEASURED on this fixture at 48 frames, on the dev M4 Max, at the base
# commit before the rebase:
#
#   serial      23 of 24 renders byte-identical, one outlier
#   12-way      TEN DISTINCT IMAGES IN TWELVE, worst pair mean-delta 23.24
#   concurrent  over 42.56% of pixels
#
# and after rebasing onto #296, twelve serial and twelve 12-way concurrent
# renders give ONE hash. Recorded because it is the clearest measurement of
# what #296 bought that this repo has, and because a serial repeat count is
# not evidence of determinism -- the serial run was 23-of-24 while the
# concurrent one was 2-of-12.
r_ocean 1
r_ocean_wind_speed 12
r_ocean_wind_dir_deg 0
r_ocean_choppiness 1.0
r_ocean_grid_size 128
r_ocean_march_steps 64
r_ocean_foam_amount 1.0

# r_water_absorption_* and r_water_scatter_particulate are DELIBERATELY
# absent -- see the header. Only the index of refraction is stated, because
# it is what sets the window's 48.75-degree critical angle and a reader
# should not have to look it up to know why the cone is that wide.
r_water_ior 1.33
r_water_inscatter 1
r_water_inscatter_samples 16

r_spp 2
r_max_bounces 3
r_firefly_clamp 8
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.30

r_env_map ""
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
