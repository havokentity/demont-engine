#
# Land cover (#300) / reference-scale slope (#307) acceptance fixture: a
# camera where the ROCK RAMP is the variable under test.
#
# WHY A NEW CELL, AND WHY NOT planet_surface.
#
# planet_surface stands at 27.9881 N 86.9250 E -- Everest -- at 6 264 m.
# Two measured facts about that camera make it the wrong place to judge
# rock exposure:
#
#   1. It is a SNOWFIELD. The derived snowline at 28 N is 4 064 m, so
#      every surface in frame is 2.2 km above it and snow is the correct
#      answer there whatever the slope does.
#   2. The ground under it is not a threshold hillslope. Measured on
#      earth_lite over a 2x2 chunk block at the site, the slope at the
#      reference baseline (180 m, see kRefSlopeLevel in
#      src/renderer/Planet/TerrainChunk.h) has a MEDIAN OF 12.04 deg and a
#      p99 of 30.6 deg. The threshold hillslope is 30 deg. So the ramp
#      correctly returns ~0 -- mean rock 0.0007 -- and a white cone is the
#      right render of that terrain, not a bug in the ramp.
#
#      The reason the ground is that gentle is worth naming and is NOT
#      this issue: earth_lite is ETOPO area-averaged to 2 048 x 1 024
#      (tools/fetch_planet_dem.py), and an area average destroys the
#      inter-cell variance the fractal continuation is anchored on. The
#      DEM's relief at the site is 289 m per 19.5 km texel, against
#      1 479 m one texel-row south on the range front.
#
# THIS CELL GOES WHERE THE TERRAIN IS ACTUALLY STEEP. 28.389 N 84.111 E is
# the Annapurna Himal in central Nepal -- which is, not by coincidence, the
# study area of Gabet, Pratt-Sitaula & Burbank (2004), Geology 32:629, the
# paper the ramp's 30 deg threshold and its 270 m measurement baseline come
# from. earth_lite carries 1 341 m of relief there, and the reference-scale
# slope has a median of 42.96 deg against the ramp's 30-45 deg band:
# measured mean rock exposure 0.6048, median 0.9352.
#
# The camera also reaches the SNOWLINE. Standing 900 m above ground at
# 3 012 m, about 7% of the terrain pixels come out snow-like -- so the frame
# carries bare rock, the ramp's own transition band, and the small amount of
# snow that survives on ground gentle enough not to shed it. That mixture is
# #300's "a mountain reads as rock AND snow rather than as a white cone",
# and nothing else in the matrix shows it.
#
# WHAT THIS CELL WOULD CATCH. It is an ACCEPTANCE cell for the ramp, not the
# regression cell for #307's LOD dependence -- planet_lod_seam is that one,
# because it is the fixture with the finest resident level and it moves 9.2%
# of its pixels. This cell moves too, and by more: 14.3% of pixels bad,
# mean L2 7.50, max 140.4 between clean main and #307. What it pins is that
# the ramp is ENGAGED somewhere in the matrix at all -- regress its
# endpoints, or feed it a slope from the wrong baseline, and this massif
# turns uniformly grey or uniformly white.

# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

# The site, stated: this cell is ABOUT its coordinates.
r_planet_site_lat 28.389
r_planet_site_lon 84.111

# 900 m above the terrain, looking out and slightly down.
cam_pos 0 0 0
r_planet_stand_eye 900
cam_yaw -90
cam_pitch -8
cam_fov 60

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_lod_error_px 1.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 13
r_planet_chunk_budget 2048
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

# Land cover, stated rather than inherited so this fixture declares the
# thing it exists to test.
r_planet_albedo_map assets/planet/earth_lite.ptalb
r_planet_land_albedo 1
r_planet_snowline 4900

# Sun mid-morning and off to the side so relief reads as relief. The same
# geometry as planet_surface, so the two cells differ in WHERE they stand
# and in nothing else about the light.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# EXPOSURE, DERIVED THE WAY planet_surface's WAS. This frame has to hold
# bare rock (albedo 0.26) and snow (0.85) on screen at once or it stops
# measuring land cover and starts measuring clipping -- a 3.3x reflectance
# ratio, so there is only so much room. Swept against the ACES curve over
# the terrain pixels:
#
#   exposure   median   p99    clipped   distinct   rock-snow
#                                          colours    separation
#   0.004        18.2   104.8    0.00%       8332        72.3
#   0.006        34.4   134.8    0.00%      10913       101.3
#   0.008        76.7   156.8    0.00%      11752       122.7
#   0.012       131.2   184.9    0.00%      11501       100.3
#   0.018       170.1   222.2    0.00%      10227        93.6
#
# 0.008 is the peak of BOTH the distinct-colour count and the rock-snow
# separation (terrain luminance p90 - p10), with nothing clipped in any
# channel. Those two are the acceptance criterion restated as numbers:
# the colour count is how much of the land cover survives the tone curve,
# and the separation is how far rock is from snow. Both fall off either
# side, so this is a measured optimum rather than a value that merely
# looked all right.
#
r_exposure 0.008
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1

# Pin the ocean OFF, for the reason planet_surface pins it: the
# r_scene_default=earth seed gained r_planet_ocean 1 in #306, and a cell
# that leaves it unstated would silently start rendering a sea it was never
# characterised against.
r_planet_ocean 0
