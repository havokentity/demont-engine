#
# Planetary P3 (#257) acceptance fixture: distant clouds must merge with
# the horizon at a ground-level camera. That is issue #51's founding
# symptom and the criterion it was opened to fix.
#
# A ground camera looks dead level at a low cloud deck. In the SPHERICAL
# frame the deck is a shell, the ground curves away beneath it, and the
# deck therefore terminates exactly where the planet body's limb does --
# clouds touch the horizon. In the PLANAR frame (the A/B counterpart,
# planet_horizon_clouds_planar.cfg) the deck is a pair of infinite planes
# a horizontal ray can never reach, so it stops at a hard line with a
# strip of bare sky beneath it. The pair is only meaningful with BOTH
# halves pinned.
#
# The ground plane seed is skipped deliberately. The flat y=0 plane sits
# ABOVE the sphere everywhere except the tangent point, so it wins every
# near-horizontal hit and would paint a flat-Earth horizon over the body
# this fixture exists to show.
#
# Parser-safety: no semicolons or backticks anywhere in this file
# (including comments). The engine console splits scripts on both
# newline AND semicolon, even inside hash-prefixed comment lines.

app_window_width 640
app_window_height 360

# Human eye height, looking dead level at the horizon.
cam_pos 0 1.7 0
cam_yaw -90
cam_pitch 0
cam_fov 50

# No default primitives or CSG -- the planet body IS the scene.
pt_smoke_skip_prim_seed 1
pt_smoke_skip_csg_seed 1

# Spherical world frame + the analytic planet body.
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_ground_albedo 0.18

# Mid-morning sun off to the left so the deck is lit from the side and
# its far edge is not washed out by the disc.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 15
r_sun_azimuth 200

# A low stratocumulus deck. 200-500 m is real for stratocumulus, and it
# is low enough that its horizon chord (about 50 to 80 km from eye
# height) sits inside the marched range.
r_clouds 1
r_clouds_preset custom
r_clouds_coverage 0.55
r_clouds_base_height 200
r_clouds_top_height 500
r_clouds_density 0.12
r_clouds_freq 0.0015
r_clouds_detail 0.35
r_clouds_wind_x 0
r_clouds_wind_z 0
r_clouds_seed 5

# Atmosphere at its real settings for this phase.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 24

# The medium at its REAL settings, stated in the fixture rather than
# inherited. These are the values #257 makes physical -- Rayleigh at
# 1.0x the real column (Bodhaine et al. 1999), aerosol at Hillaire
# 2020's clear-sky sea-level scattering coefficient, ozone at 1.0x the
# US Standard Atmosphere 1976 column. Pinned here because a fixture
# that inherits a default silently re-renders whenever the default
# moves, which is exactly how the pre-#257 sunset fixtures ended up
# being the only ones this phase did not shift.
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.07055
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1

# --- Planetary P4 (#258) ---
# Pin the seeded scene. The engine's r_scene_default flipped to `earth` in
# #258, so every fixture that renders the historical three-spheres-plus-
# drilled-cube arrangement -- or that relies on the seed being suppressed
# by its own pt_smoke_skip_* lines -- states which scene it wants rather
# than inheriting a default that has now moved once and could move again.
# Stating it here is what made that switch cost zero regenerated goldens.
r_scene_default spheres_csg
