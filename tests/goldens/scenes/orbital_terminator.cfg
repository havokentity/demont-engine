#
# Planetary P6 (#260) acceptance fixture: a lit limb and a dark side in
# ONE frame, with a graded terminator between them.
#
# This frame was not expressible before P0 (#254). Every "how high is the
# sun" term in the sky chain read the single global scalar sun_and_mode.y,
# so the whole world shared one solar elevation and a planet could only
# ever be uniformly lit or uniformly dark. P0 gave every point its own
# local up; this phase delivers the picture.
#
# There is NO TERMINATOR TERM anywhere in the code. The gradient is what
# sunSlantTransmittance returns when it is evaluated at each march sample:
# zero where the ray from the sample to the sun runs into the body, near
# one where it climbs straight out, and a reddened partial in between
# because the slant path crosses tens of air masses of Rayleigh and the
# blue is scattered out of it first. The penumbra of the sun's own
# angular radius (0.2666 deg mean, IAU) is likewise not modelled as a
# softening -- it is what the finite disc sampling produces.
#
# The sun is 2 degrees above the horizon at the sub-camera point, so the
# terminator runs through the visible disc rather than around its edge,
# and the 70 degree FOV puts both ends of it in frame.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

cam_pos 0 400000 0
cam_yaw -90
cam_pitch -40
cam_fov 70

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_ground_albedo 0.18

r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 2
r_sun_azimuth 200

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 24
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
# See orbital_limb.cfg: the lit limb is content, not a firefly.
r_firefly_clamp 200
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Brighter than orbital_limb because most of this frame is night side --
# the point of the cell is that the dark half is dark WITHOUT being
# empty, so the exposure has to leave the lit half visible.
r_exposure 0.15

r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
