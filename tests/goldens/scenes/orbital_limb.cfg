# Planetary P6 (#260) acceptance fixture: the planet from 400 km.
#
# This is the frame the whole arc is named after, and the frame that
# rendered as a BLACK DISC on main. Two independent defects produced it,
# and this cell pins both fixes at once:
#
#   * the aerial-perspective transmittance spread eight uniform Simpson
#     subintervals over the whole 400 km camera-to-surface distance, so
#     the last one was 50 km long with sea-level extinction at its right
#     endpoint. tau came out 81% high at 400 km and 9250% high at 30 Mm,
#     where exp(-13.7) is the black disc. The integral now clips to the
#     medium first -- see ptAtmoOpticalDepth and pt_atmosphere_test's
#     "the planet is not a black disc from orbit".
#   * the SKY was frozen. procSky is a lerp between two hardcoded RGB
#     literals and returns the same blue at eye height and at 400 km.
#     Measured on a rendered climb it plateaus at 56.3/255 luminance from
#     200 km up and the black-space fraction of the frame stays at
#     exactly 0.000 all the way out. r_sky_mode physical integrates the
#     real shell instead, so the sky is black where the chord is empty.
#
# WHAT THE FRAME SHOULD SHOW: black space, a thin blue atmospheric limb
# hugging the body, and a lit surface below it. The limb is the ~2.8
# degrees of arc between 17.06 deg and 19.85 deg below local horizontal
# (asin(6471/6771) and asin(6371/6771)), which is why a sky-view LUT
# could not represent it and why this phase marches per pixel instead.
#
# NO TERRAIN. r_planet_terrain 0 keeps this cell on the P3 analytic body:
# terrain cells are unregistered pending #284, and the claim here is
# about the ATMOSPHERE, which the analytic body exercises completely.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

# 400 km -- the ISS. Pitched down 8 degrees so the limb crosses the frame
# with black space above it and the body below.
cam_pos 0 400000 0
cam_yaw -90
cam_pitch -8
cam_fov 55

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_ground_albedo 0.18

# The mode that survives leaving. Implies r_sun_physical_transmittance.
r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

# Atmosphere at its real P3 settings, stated rather than inherited.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 24
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
# The limb legitimately exceeds the sky fixtures' usual clamp of 10 -- a
# grazing chord crosses hundreds of km of the densest air and is the
# brightest thing in frame. Clamping it here would be a CONTENT clip, not
# a noise clip, and would pin exactly the feature the cell exists for.
# The primary-miss term is unclamped anyway (clampIndirect only guards
# bounce rays), so this raises only the indirect ceiling.
r_firefly_clamp 200
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.01587
r_bloom 0
r_lens_flare 0
# Orbital velocity is 7 672 m/s, so at 60 fps the camera translates 128 m
# per frame against a 1e10 sky depth sentinel. MetalFX's disocclusion
# heuristics thrash on limb pixels under that, and every sky fixture in
# this repo already captures denoiser-free by design.
r_denoiser off

r_capture_format png
r_capture_seed 1
