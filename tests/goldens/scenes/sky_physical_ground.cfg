#
# Planetary P6 (#260): the BOTTOM of the climb, in the same sky mode as
# the top of it.
#
# orbital_limb.cfg and orbital_terminator.cfg pin what the physical sky
# looks like from outside the atmosphere. This cell pins that the SAME
# code, with no branch on altitude anywhere in it, still produces a
# daytime sky from eye height -- because "one camera path from the
# surface to orbit" is a claim about there being one renderer, and the
# cheapest way to make that claim false is to quietly get the ground case
# wrong while the orbital pictures look right.
#
# The sky here is a real integral through the 100 km shell: Rayleigh
# scattering (Bodhaine et al. 1999 cross-sections) with the
# 3/(16 pi)(1 + mu^2) phase, aerosol with Cornette-Shanks at g = 0.8, and
# ozone as extinction on the sun's slant path. It is SINGLE SCATTER only,
# so the zenith reads darker than a real clear-sky zenith, where
# second-order Rayleigh is a large fraction of the total. That is a
# stated limitation of this phase, not a defect of the fixture -- the fix
# is a multiple-scattering LUT, named in #253 and deliberately not built
# here.
#
# The same camera under r_sky_mode procedural is procedural_noon.cfg's
# family, which stays untouched: mode 4 is additive and every pre-#260
# golden is bit-stable.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

# Human eye height, looking level at the horizon.
cam_pos 0 1.7 0
cam_yaw -90
cam_pitch 0
cam_fov 55

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_ground_albedo 0.18

r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 24
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 200
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.01587
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
