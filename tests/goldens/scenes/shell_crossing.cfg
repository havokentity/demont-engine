#
# Planetary P6 (#260): the camera crossing the top of the atmosphere.
#
# WHAT THIS CELL IS FOR, AND WHY IT IS NOT A GOLDEN
#
# The phase's acceptance is a claim about a SEQUENCE -- a climb from
# 1.7 m to 400 km with no discontinuity -- and a stored PNG cannot settle
# a claim about a sequence. Neither can a threshold on adjacent frames,
# because adjacent frames are SUPPOSED to differ: the sky really is
# changing all the way up.
#
# A discontinuity has an exact definition that needs no threshold at all:
# it is a change that survives refinement. If the image is a continuous
# function of altitude then two frames one metre apart are the same
# frame, at every altitude, however the renderer is put together. So this
# cell renders one metre either side of the top of the shell and requires
# the two to agree to within the fixture's own run-to-run noise, with a
# companion cell that renders the SAME altitude twice to measure what
# that noise is. Both are diffed at the same bar. If the crossing cell
# passes and the noise cell passes, the crossing is not a step.
#
# WHY THIS ALTITUDE. R_top = r_planet_radius + 100 000 m (the Karman
# line, the body's declared medium boundary) is the one altitude in the
# whole climb where the code changes what it does: below it the camera is
# inside the medium and the shell clip returns [0, t], above it the clip
# returns a proper sub-interval and the optical-depth integral starts at
# a nonzero entry point. Everything else on the way up is the same
# expression evaluated at a different radius.
#
# It is also where the roadmap put a cross-fade. #260 specifies a
# sky-view LUT gated on camera-inside-shell with a 10 km blend below
# R_top, on the reasoning that the two sides are the same integral so the
# blend only hides LUT quantisation. There is no LUT here and no blend:
# the sky is marched at every altitude, so the crossing is not a mode
# switch to be hidden, and this cell is the proof of that rather than a
# measurement of the blend's quality.
#
# DESIGN RULE FROM THE ISSUE, HONOURED BY CONSTRUCTION: no planetary
# state transition may require a history reset. Nothing here is an
# engine-side mode change -- the shell clip is a shader-side branch on a
# pushed uniform -- so accum_dirty_ is never set by crossing, and a live
# fly-through does not flash.
#
# The _above half overrides cam_pos from the ctest command line so the
# two halves cannot drift apart in anything but the altitude.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 320
app_window_height 240

r_scene_default earth

# One metre BELOW the top of the shell. r_planet_radius defaults to the
# IUGG mean 6 371 008.8 m and ptAtmoEarth puts the top 100 km above the
# ground radius, so the boundary is at an altitude of exactly 100 000 m.
cam_pos 0 99999 0
cam_yaw -90
cam_pitch -8
cam_fov 55

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_ground_albedo 0.18

r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 24
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 200
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.01587
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
