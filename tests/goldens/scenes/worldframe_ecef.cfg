# Planetary P1 (#255) -- the ECEF half of the camera-anchored-frame
# equivalence pair. Identical to worldframe_origin.cfg with every
# canonical world coordinate offset by +6,370,304 m in y.
#
# 6,370,304 = 6221 * 1024 sits exactly on the anchor lattice, and the
# camera is well inside half a lattice cell of it, so the anchor this
# scene computes is EXACTLY the offset. The render frame the GPU sees is
# therefore bit-for-bit the render frame the origin half produces -- and
# that is the point: the same pixels must come out of a scene sitting at
# planetary radius as out of one sitting at the origin.
#
# This scene and worldframe_ecef.cfg describe the SAME arrangement of
# geometry, lights and camera. The only difference is that every
# canonical world coordinate in the other file is offset by
# +6,370,304 m in y -- one metre short of 6221 lattice steps, i.e. the
# IUGG mean Earth radius to within 705 m, placed exactly on the anchor
# lattice so the two renders are directly comparable.
#
# The pair is checked actual-against-actual at --max-delta 0. The claim
# is not "these look similar", it is "the renderer's output does not
# depend on where in canonical space the scene sits", which is the whole
# of what this phase delivers. Before #255 the ECEF half is not merely
# different, it is destroyed: one float32 ULP at 6.37e6 m is 0.5 m,
# larger than every self-intersection epsilon in the tracer and larger
# than two of the three spheres below.
#
# Kept deliberately small in scope: no atmosphere, no clouds, no
# denoiser, no post. Those subsystems have their own coordinate
# couplings (the sky chain still reads shader-frame y as an altitude,
# which is a P3 concern) and mixing them in would blur what this cell
# measures.
#
# Parser-safety: no semicolons or backticks anywhere in this file,
# comments included. The console splits scripts on both newline AND
# semicolon.

# Modest extent -- two full renders per equivalence cell.
app_window_width 384
app_window_height 256

# Eye 1.6 m above the ground, 4 m back, looking slightly down. Well
# inside one lattice cell of the origin so the ECEF variant's anchor
# lands exactly on the offset.
cam_pos 0 6370305.6 4
cam_yaw 0
cam_pitch -12
cam_fov 55

# Sky is a pure function of ray DIRECTION, so it is translation
# invariant by construction and stays in the picture as a control: if a
# conversion ever leaked into a direction, the sky would move too.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 28
r_sun_azimuth 140
r_show_stars 0
r_star_split 0

# Atmosphere and clouds off -- see the header note.
r_volumetric 0
r_clouds 0
r_fog 0

# Seed our own scene rather than the engine defaults, so both halves of
# the pair carry exactly the geometry written below and nothing else.
pt_smoke_skip_prim_seed 1

# Ground plane through the origin: dot(n, p) + d = 0 with n = +Y, d = 0.
prim_plane 1 0 1 0 -6370304 lambert 0.55 0.55 0.58

# Three metre-scale spheres. Sub-metre features on purpose: at ECEF
# radius the float32 grid is 0.5 m, so anything at this scale is exactly
# what an absolute-coordinate renderer cannot hold.
prim_sphere 10 -1.6 6370304.9 0    0.9 lambert    0.85 0.25 0.22
prim_sphere 11  0.6 6370304.7 0.9  0.7 metal      0.95 0.85 0.55 0.08
prim_sphere 12  2.2 6370304.5 -0.6 0.5 dielectric 1.00 1.00 1.00 0.0 1.5

# One point light, off to the side so the shadows are unambiguous.
light_point 1 -2 6370308.0 3  60 55 50

# Move the CSG mesh with the rest of the scene. mesh_step has to run
# late (the csg_* / mesh_* commands are not registered during early cfg
# exec), so the cell supplies pt_smoke_late_exec with an absolute path
# to worldframe_ecef_late.cfg -- see tests/CMakeLists.txt.

# Path tracer. Low spp with a pinned seed -- both halves consume the
# same PRNG stream, so an equal render is an exactly equal render.
r_spp 2
r_max_bounces 3
r_firefly_clamp 10
r_caustics 0
r_refract_bounces 2
r_accum_ema_alpha 0

# Manual exposure and no post: auto-exposure would make the result
# frame-count dependent, and bloom is not what this cell measures.
r_hdr_pipeline 1
r_auto_exposure 0
r_exposure 0.008818
r_bloom 0
r_lens_flare 0

# Motion blur off: the ECEF halves move the CSG mesh with a mesh_step,
# which makes prev != curr, and a live shutter would smear the mesh
# across a planetary distance.
r_motion_blur 0

# Denoiser off -- this is a coordinate test, not a temporal one.
r_denoiser off

# The default rebase radius. This half is far outside it, so the anchor
# engages and every GPU-facing coordinate is packed relative to it.
r_origin_rebase_radius 65536

r_capture_format png
r_capture_seed 1

# --- Planetary P4 (#258) ---
# Pin the seeded scene. The engine's r_scene_default flipped to `earth` in
# #258, so every fixture that renders the historical three-spheres-plus-
# drilled-cube arrangement -- or that relies on the seed being suppressed
# by its own pt_smoke_skip_* lines -- states which scene it wants rather
# than inheriting a default that has now moved once and could move again.
# Stating it here is what made that switch cost zero regenerated goldens.
r_scene_default spheres_csg
