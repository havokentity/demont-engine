# Planetary P7 (#261): the same pool as water_pool.cfg, from underneath.
#
# WHY A SECOND POOL. water_pool.cfg watches submerged geometry from ABOVE
# the surface, which is where the ungated skylight ambient shows up as a
# glowing sea floor. This cell is the other half of #261's acceptance and
# the half no fixture in the matrix has ever covered: the camera itself
# inside the medium, with real geometry to occlude the sun. Three things
# only exist here.
#
#   1. THE IN-SCATTER MARCH RUNS AT ALL. It is gated on primary_in_water,
#      which is latched from the host's submerged scan at ray-gen. Every
#      other water fixture has the camera in air, so before this cell the
#      march was unreachable from the golden matrix.
#
#   2. THE PARTICULATE SPECIES IS EXERCISED. r_water_scatter_particulate
#      0.15 is a Jerlov coastal-type value, and it is the only cell that
#      switches the Petzold g = 0.924 forward lobe on. Left at the 0.0
#      default -- which planet_underwater_column.cfg uses deliberately --
#      the whole Henyey-Greenstein branch is dead code in the matrix.
#
#   3. SHAFTS. The two spheres and the pool floor occlude the per-sample
#      sun NEE, which is where god rays come from: no separate term, just
#      visibility inside the march. Nothing else in the matrix has an
#      occluder between a submerged sample and the sun.
#
# WHAT THE CAMERA SEES. At y = -0.8 it sits between the water surface at
# y = 0 and the sandy floor at y = -2, pitched up 25 degrees so Snell's
# window, the underside of the half-submerged sphere and the lit floor are
# all in frame at once. Absorption is water_pool's own (0.45, 0.15, 0.05) --
# NOT the new Pope & Fry defaults -- so this cell isolates the in-scatter
# and the ambient gate from the reparameterisation of the defaults, which
# planet_underwater_column.cfg pins separately. Two changes in one cell
# would be one cell that cannot attribute either.
#
# Parser caveats mirror water_pool.cfg -- no semicolons or backticks
# anywhere in this file, even inside comments.

app_window_width 512
app_window_height 384

# THE FLOOR IS SEVEN METRES DOWN, AND THE DEPTH IS DERIVED. water_pool's
# own pool is 2 m deep, and at r_water_absorption_g 0.15 that is 0.3 of a
# green e-folding: the skylight reaching its floor is 74% of the skylight
# above it, so gating the ambient there changes almost nothing and the cell
# cannot measure the fix. MEASURED at that depth: deleting the gate moved
# the frame by mean 1.27 on 1.75% of pixels at one framing and mean 1.68 on
# 0.75% at another -- one criterion or neither, on a headline claim.
#
# One e-folding of the GREEN channel is 1 / 0.15 = 6.67 m, so the floor sits
# at 7 m: the sky reaching it is 35% / 5% / 70% of the sky above, per
# channel, and the ambient term is the thing the gate is about. Deeper would
# be a blacker frame, not a better test -- past three e-foldings the floor
# stops being lit by anything and the difference between two dim terms is
# below the display again.
#
# Pitched up 15 degrees with a 90-degree lens so the frame holds BOTH halves
# of the acceptance: Snell's window and the total-internal-reflection rim in
# the top third (the rim sits at 41 degrees elevation, inside the +60 degree
# top edge), and a broad expanse of submerged Lambert floor below.
cam_pos 0 -3.0 4
cam_yaw 0
cam_pitch -22
cam_fov 95

r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 45
r_sun_azimuth 135

r_spp 1
r_max_bounces 6
r_firefly_clamp 10
r_caustics 1
r_refract_bounces 4
r_accum_ema_alpha 0
r_svgf_atrous_passes 1
r_hdr_pipeline 1
r_auto_exposure 0
# Two stops over water_pool's 0.05. Underwater is dark by construction and
# a golden that is mostly black cannot fail informatively -- an ablation
# that deletes the whole in-scatter term would leave a frame that still
# diffs as "black-ish" against a black-ish reference. The exposure is set
# so the column occupies the middle of the range, which is what makes the
# ablation table below the registration in tests/CMakeLists.txt mean
# something.
r_exposure 0.20
r_env_map ""
r_env_intensity 0.6
r_bloom 0
r_lens_flare 0
r_capture_format png
r_capture_seed 1

# water_pool's own absorption, verbatim, for the attribution reason in the
# header.
r_water_absorption_r 0.45
r_water_absorption_g 0.15
r_water_absorption_b 0.05
r_water_ior 1.33
r_water_wave_scale 0.3
r_water_wave_amplitude 0.2
r_water_wave_speed 0.0

# Planetary P7 (#261). A Jerlov coastal particulate load, scattered with
# the Petzold average-particle phase function -- the forward lobe that puts
# visible haze and shafts in the water where the molecular term puts blue.
r_water_scatter_particulate 0.15
r_water_inscatter 1
r_water_inscatter_samples 16

pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

# Sea floor at y = -7, sandy tan. See the camera block for why 7.
prim_plane 1 0 1 0 7 lambert 0.75 0.60 0.35

# Water surface at y = 0.
prim_plane 2 0 1 0 0 water 1.0 1.0 1.0

# Half-submerged sphere -- from below, its underwater cap is the occluder
# that puts a shaft in the column.
prim_sphere 10 0.0 0.3 0.0 0.6 lambert 0.95 0.25 0.20

# Fully submerged reference sphere.
prim_sphere 11 1.3 -0.6 0.0 0.4 lambert 0.90 0.90 0.30

# --- Planetary P4 (#258) ---
# Pin the seeded scene, for water_pool.cfg's reason.
r_scene_default spheres_csg
