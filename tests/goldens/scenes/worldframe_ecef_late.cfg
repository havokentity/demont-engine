#
# Planetary P1 (#255) late-exec companion to worldframe_ecef.cfg.
# Runs after SeedDefaultCsgScene and RegisterCsgCommands, which is the
# earliest point mesh_step exists.
#
# Moves the default CSG mesh (the drilled cube, baked at the world
# origin) by the same canonical offset every other coordinate in the
# parent fixture carries. On the hardware ray-query path this lands as a
# ray-origin shift against a BLAS whose vertices never move, while the
# ANCHOR rides separately in the TLAS instance transform -- so the pair
# of them is what proves a rebase costs one instance rewrite and touches
# no BLAS.
#
# The offset is an exact integer below 2^24, so it survives the float
# console argument without rounding.

mesh_step 0 6370304 0
