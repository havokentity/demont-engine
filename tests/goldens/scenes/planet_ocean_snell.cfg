#
# Planetary P5 (#259): Snell's window, which did not exist before this phase.
#
# THE BUG THIS CELL PINS THE FIX FOR. oceanRayMarch's surface-crossing test
# has been `diff_prev > 0.0 && diff_cur <= 0.0` since #25 -- above to below
# ONLY. A ray originating below the surface and travelling up starts with
# diff_prev < 0 and can never register a crossing, so it fell silently
# through to the flat analytic surface. Everything a submerged camera saw
# looking up was therefore geometrically wrong, and nothing in the golden
# matrix could tell, because no fixture had ever put a camera under water.
#
# WHAT SHOULD BE VISIBLE. The whole sky, refracted into a cone of half-angle
# asin(1/1.33) = 48.6 degrees straight overhead -- Snell's window -- with the
# wave field breaking its rim into a moving lace, and total internal
# reflection everywhere outside it. The camera's 130-degree field of view is
# chosen so the 97.2-degree window sits INSIDE the frame with the TIR region
# around it: a narrower lens would fill the frame with window and the cell
# would stop being able to see whether the rim is in the right place.
#
# The absorption is dialled down an order of magnitude from the open-ocean
# values the other P5 fixtures use. That is not cosmetic -- at r_water
# _absorption_r 0.40 a 12 m column removes the red channel entirely and the
# window would read as a blue disc rather than as a refracted sky.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth
pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 0
r_planet_ocean 1
r_planet_radius 6371008.8

# Twelve metres down, looking almost straight up. Deep enough to be clear of
# the 5 m summed crest peak with margin, shallow enough that the absorption
# below still leaves a lit frame.
cam_pos 0 -12.0 0
cam_yaw 0
cam_pitch 89
cam_fov 130

r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 60
r_sun_azimuth 0

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_ocean 1
r_ocean_wind_speed 12
r_ocean_wind_dir_deg 0
r_ocean_choppiness 1.0
r_ocean_grid_size 128
r_ocean_march_steps 64
r_ocean_foam_amount 1.0

# Clear coastal water rather than open ocean, for the reason in the header.
r_water_absorption_r 0.04
r_water_absorption_g 0.01
r_water_absorption_b 0.005
r_water_ior 1.33

r_spp 2
r_max_bounces 3
r_firefly_clamp 8
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.05291
r_env_map ""
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
