#
# Planetary P4 (#258) acceptance fixture: standing on the planet.
#
# A camera at human eye height on the reference site, looking level at the
# horizon. What this cell pins:
#
#   * that streamed terrain reaches the screen at all -- the first frame in
#     this engine's history where CommittedInstanceID() is read and the mesh
#     hit's material comes from a descriptor instead of being hard-coded;
#   * that the LOD selector converges to a stable residency set, which
#     r_planet_lod_freeze then pins;
#   * that the surface is continuous across the LOD boundaries the horizon
#     necessarily crosses -- from 1.7 m the horizon is 4 654 m away and the
#     chunks between here and there span several levels.
#
# DETERMINISM. Terrain chunks are baked asynchronously on a worker pool, so
# without a settle barrier the residency at frame N would be a function of
# wall clock and this cell could never reproduce. pt_planet_settle_rounds
# drives the selector to its fixed point before the capture starts -- one
# bake round per iteration, each round waiting for every requested chunk to
# land rather than for a frame to elapse. The frame the barrier runs in is
# held exactly like a loading frame: the world does not advance and the
# frame does not count. r_planet_lod_freeze then pins the set so the
# accumulation frames all trace identical geometry.
#
# The predecessor of this cvar counted RENDERED FRAMES, which made settling
# a race between the frame rate and the bake rate -- see #284.
#
# PINNED AGAINST REAL EARTH. assets/planet/earth_lite.ptdem is committed, so
# this cell captures the ETOPO 2022 surface at the reference site and not the
# fractal fallback -- which is the whole reason the exposure note below talks
# about snow on the Himalaya. See assets/planet/PROVENANCE.md. Point
# r_planet_dem at nothing and the same camera renders a PROCEDURAL body
# instead, and that ablation is what sizes this cell's thresholds: it moves
# the image by mean 185.6 with 99.9% of pixels bad. (This paragraph used to
# say the DEM was not committed yet. It is.)
#
# Parser-safety: no semicolons or backticks anywhere in this file, comments
# included. The console splits scripts on both newline AND semicolon.

app_window_width 512
app_window_height 384

# The planet IS the scene.
r_scene_default earth

# Human eye height on the reference site, looking dead level at the horizon.
cam_pos 0 1.7 0
r_planet_stand_eye 1.7
cam_yaw -90
cam_pitch 0
cam_fov 55

# Terrain, pinned explicitly rather than inherited from the seed so this
# fixture states its own configuration.
r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_lod_error_px 1.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 13
r_planet_chunk_budget 2048
r_planet_workers 4
# No pacing during a capture: every chunk the selector wants is built in the
# frame it is wanted, which is what makes the settle gate terminate quickly.
# Interactive sessions keep the 2 ms budget.
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

# Sun mid-morning and off to the side so the relief reads as relief.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

# Atmosphere at its real P3 settings, stated rather than inherited.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Snow is albedo ~0.85 (Budyko 1974); the 0.4 here was tuned against the
# 0.18-albedo procedural fallback and blew the real Himalaya out to white.
# 0.01587 was that 0.4 divided by the albedo ratio, so the surface landed
# back in range and the geometry became visible.
#
# LAND COVER (#300) MOVED THE SURFACE IT WAS DERIVED FROM. That exposure
# assumed a snow-white surface, and the surface is no longer snow-white:
# the measured rock fraction here has a MEDIAN of 0.918 (70% of pixels
# above 0.5), because the terrain's slopes clear the 30-degree threshold
# hillslope that #300's ramp starts at -- and the ramp it replaced was zero
# below SIXTY degrees, so none of that rock was ever exposed. The composite
# albedo fell from ~0.85 to ~0.31.
#
# Re-derived by measurement rather than by scaling. At 0.01587 the frame is
# not clipped (p99 = 0.929) but its MEDIAN is 0.682, so rock and snow both
# sit in the tone curve's shoulder and the image reads as uniform white
# whatever it actually contains. At 0.004 the median is 0.314 -- middle
# grey -- with p99 at 0.710, nothing clipped, and 190 distinct luminance
# levels. Rock reads as rock and snow reads as snow, which is what this
# cell has to be able to show for #300's acceptance to mean anything.
#
# #307 FALSIFIED THE ROCK FRACTION ABOVE, AND THE EXPOSURE SURVIVES IT.
# The 0.918 median was read off the MESH normal, whose slope baseline is
# 38 m at this cell's resident level. Measured at the baseline the 30-degree
# threshold was actually published at -- 180 m, see kRefSlopeLevel in
# src/renderer/Planet/TerrainChunk.h -- the ground here has a slope median
# of 12.04 degrees and the rock fraction is MEDIAN 0.0000, MEAN 0.0007. So
# the composite albedo did NOT fall to ~0.31; this is a snowfield 2.2 km
# above the derived snowline and it is correctly white.
#
# The exposure is left at 0.004 because it was re-measured and does not
# need to move: on the regenerated golden the frame's luminance median is
# 0.523 (against 0.521 before #307), p99 0.742, max 0.765, NOTHING clipped
# in any channel, and 189 distinct luminance levels. What this cell can no
# longer claim to show is rock -- for that see planet_hillslope_rock, which
# #307 adds precisely because this camera cannot.
r_exposure 0.004
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1

# --- Planetary (#306) ---
# Pin the ocean OFF. The r_scene_default=earth seed gained r_planet_ocean 1
# in #306 (a default planet has an ocean), and this cell left the cvar
# unstated -- so without this line the seed would write it and the cell
# would silently start rendering a sea it was never characterised against.
# Same reason, and the same fix, as the r_scene_default pin #258 added:
# state what the cell wants instead of inheriting a default that moves.
# Stating it also keeps the feature-deleted ablation honest -- seed_cvar
# skips any cvar the fixture assigned, so `--extra r_planet_ocean 0` is a
# real ablation here rather than a value the seed overwrites.
r_planet_ocean 0
