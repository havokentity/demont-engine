#
# Land cover (#300) acceptance fixture: the planet from orbit, where the
# raster is the whole point.
#
# WHY A NEW FIXTURE AND NOT planet_surface. The surface cell stands at
# 27.99 N with a 4.7 km horizon, and the albedo raster's texel is 19.5 km
# across -- so the raster contributes ONE COLOUR to that entire frame and
# cannot be seen to be right or wrong there. Everything #300 claims about
# land cover is a claim at a scale only an orbital camera reaches.
#
# WHAT THIS CELL PINS. The whole illuminated disc, so the claim under test
# is the acceptance criterion itself -- that the planet is RECOGNISABLE:
#
#   * the equatorial and monsoon belts read GREEN, because chlorophyll
#     absorbs at 430 and 662 nm;
#   * Arabia, Iran and the Thar read TAN, because iron oxide absorbs toward
#     the blue and MODIS band 1 exceeds band 4 exceeds band 3 there;
#   * the coastlines are where the DEM's own sign change puts them, because
#     the raster's coverage mask is derived from that grid and not from the
#     imagery.
#
# A pre-#300 render of this camera is a uniformly lit sphere of one albedo.
#
# WHY 30 000 km AND NOT 400. Two reasons, and the second is the honest one.
#
#   1. At 400 km the frame spans a few hundred kilometres and the raster's
#      texel is 19.5 km, so a texel covers ~50 pixels: the cell would be
#      measuring the interpolation rather than the land cover.
#   2. At 400 km the LOD selector converges to level 2 over the whole globe
#      and what the ray actually meets is the P3 analytic body rather than
#      the chunks -- measured, by the fact that r_planet_ground_albedo moves
#      that frame and r_planet_snowline does not. #300 puts the raster on
#      the analytic body precisely so that view is not blank, but the
#      SLOPE and SNOWLINE modulation cannot apply to a sphere, so a 400 km
#      cell would pin only half the phase. From full-disc range the raster
#      is sub-pixel and none of that is in question.
#
# The surface half of the phase -- slope-driven rock and the
# latitude-derived snowline -- is pinned by planet_surface and by
# tests/pt_planet_albedo_test.cpp, which measures both against published
# equilibrium-line altitudes and threshold hillslopes.
#
# WHY NOT THE PLANETARY OCEAN. r_planet_ocean puts a shell at the SEA-LEVEL
# radius, and with terrain streaming the analytic body sits 27 705.87 m
# below that -- so the shell covers the entire body and the frame becomes
# one specular sphere. Instead r_planet_ground_albedo carries deep water's
# own measured 0.06 (Budyko 1974), which is what the uncovered part of the
# raster is.
#
# THAT SAME 27.7 km IS WHY THIS GOLDEN MOVED. The first render of this cell
# was dark with a yellow-brown cast over the whole disc, and it was not the
# land cover and not the exposure. The atmosphere's ground datum is the
# SITE's geocentric radius (6 373 458.18 m) while the analytic backstop is
# WGS-84 b - 10 935 - 65 (6 345 752.31 m), and ptAtmoOpticalDepth clipped
# its integration interval to the TOP of the shell only -- so the 27.7 km
# between the datum and the backstop was integrated with the altitude
# clamped to zero, i.e. as a slab of sea-level air. Measured out of the
# Metal kernel at the sub-solar nadir pixel:
#
#     tau  R 0.4608  G 0.7597  B 1.4338   against a true nadir column of
#     tau  R 0.0662  G 0.1468  B 0.2761
#
# 5.2x the optical depth, and since the excess is Rayleigh it reddens as
# well as dims: the transmittance R/B ratio went 1.23 -> 2.62. Both
# reported symptoms, one term. The fix gives the medium a FLOOR as well as
# a ceiling and is pinned in tests/pt_atmosphere_test.cpp, "the air column
# ends at the datum, not at the surface it hits".
#
# Parser-safety: no semicolons or backticks anywhere in this file, comments
# included. The console splits scripts on both newline AND semicolon.

app_window_width 512
app_window_height 384

r_scene_default earth

# 30 000 km, straight down over the reference site. The whole illuminated
# disc fits in a 40-degree field, which is what makes this an acceptance
# shot rather than a landscape.
cam_pos 0 30000000 0
r_planet_stand_eye -1
cam_yaw 0
cam_pitch -90
cam_fov 40

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_site_lat 27.9881
r_planet_site_lon 86.9250
r_planet_lod_error_px 1.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 13
r_planet_chunk_budget 2048
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

# Land cover, stated rather than inherited so this fixture declares the
# thing it exists to test.
r_planet_albedo_map assets/planet/earth_lite.ptalb
r_planet_land_albedo 1
r_planet_snowline 4900

# Deep water's own measured diffuse reflectance, 0.06 (Budyko 1974,
# "Climate and Life"). This is what the analytic body shows wherever the
# raster has no coverage, which is exactly the ocean -- so it is a real
# value for a real surface rather than a backdrop colour.
#
# AND IT IS SPECTRALLY FLAT, WHICH IS WHY THE SEA HERE IS GREY AND NOT
# BLUE. 0.06 is a broadband number: it is the right amount of light and
# the wrong colour of it. Real deep water is blue because it is a
# VOLUME -- red is absorbed within metres and blue is scattered back out
# -- and the engine has no water-leaving radiance for a camera outside
# the medium: P7's in-scatter march is gated on primary_in_water, so a
# ray that refracts into water from outside gets Beer's law absorption
# and no scattering at all. That is a missing term, not a wrong constant,
# and it is scoped out rather than approximated with a blue albedo here.
r_planet_ground_albedo 0.06

# Sun overhead at the site, so the land cover -- not the shading -- is what
# varies across the frame. A low sun would put most of the disc under a
# grazing cosine and hide the albedo differences this cell is about.
#
# WHAT THIS CELL DOES NOT CONTAIN, STATED RATHER THAN LEFT TO BE FOUND.
# procedural is a sky DOME -- a function of view direction with the
# observer implicitly at ground level, as r_sky_mode's own docstring says
# -- and this camera is 30 000 km up. Two measured consequences:
#
#   * space is not black. The dome paints its zenith colour at any
#     altitude, so the background here is (0.0281, 0.0572, 0.1710)
#     W/m^2/sr of sky blue rather than the zero an integral would give.
#   * there is NO aerial-perspective in-scatter anywhere on the disc.
#     The primary-hit march spans min(primary_t, 60 000 m) outside the
#     physical sky mode, and from 30 000 km that 60 km is vacuum.
#     Measured: r_volumetric_intensity 0 and 5 render this cell
#     BIT-IDENTICALLY. So the disc carries extinction and no limb, no
#     haze and no atmospheric blue over the water.
#
# Both are the sky mode, not the land cover, and both are why the
# sibling orbital cells (planet_ocean_orbit, orbital_terminator) use
# r_sky_mode physical -- the only mode with an unlimited altitude range.
# Switching this one over is its own change: it halves the distinct
# luminance levels the disc carries (221 -> 114), which is the signal
# this cell exists to measure, and it surfaces the from-orbit magnitude
# of #280's multiple-scattering term, which nothing has characterised.
# Scoped out of this change rather than folded into it.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 90
r_sun_azimuth 0

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Land reflectance runs from rainforest's 0.02 to snow's 0.9, and the
# exposure has to keep BOTH ends on screen or the cell stops measuring land
# cover and starts measuring clipping.
#
# RE-DERIVED AFTER THE ATMOSPHERE FIX, AND IT DID NOT MOVE. The frame this
# number was first chosen against was five times too dark and 10.8x too red
# -- see the header note below on the sub-datum air column -- so the value
# had to be re-measured even though the conclusion is that it stays. Swept
# against the ACES curve over the illuminated disc, r < 0.98 R:
#
#   exposure  disc median  clipped px  distinct levels  soil R-B  veg G-R
#     0.0125     0.273        0.00%          199         0.192     0.090
#     0.0200     0.383        0.00%          215         0.240     0.116
#     0.0300     0.494        0.00%          221         0.269     0.135
#     0.0500     0.637        0.00%          221         0.270     0.142
#
# 0.05 sits on the PLATEAU of distinct luminance levels and at the peak of
# both chroma separations, with nothing clipped in any channel. Those two
# separations are the acceptance criterion itself, restated as numbers:
# soil R-B is how far Arabia is from grey, veg G-R is how far the monsoon
# belt is from grey. Lowering the exposure lowers both monotonically, so a
# darker frame here would be a WORSE measurement of land cover, not a
# safer one. Left alone by measurement rather than by inheritance.
#
# (planet_surface's 0.01587 -> 0.004 re-derivation is a different problem:
# that cell is close-range on snow, where the median really did sit in the
# shoulder. Here it does not -- 0.637 is a bright sunlit disc under an
# overhead sun, and the level count says nothing is being lost to it.)
r_exposure 0.05
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1

# --- Planetary (#306) ---
# Pin the ocean OFF. The r_scene_default=earth seed gained r_planet_ocean 1
# in #306 (a default planet has an ocean), and this cell left the cvar
# unstated -- so without this line the seed would write it and the cell
# would silently start rendering a sea it was never characterised against.
# Same reason, and the same fix, as the r_scene_default pin #258 added:
# state what the cell wants instead of inheriting a default that moves.
# Stating it also keeps the feature-deleted ablation honest -- seed_cvar
# skips any cvar the fixture assigned, so `--extra r_planet_ocean 0` is a
# real ablation here rather than a value the seed overwrites.
r_planet_ocean 0
