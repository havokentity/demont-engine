#
# Land cover (#300) acceptance fixture: the planet from orbit, where the
# raster is the whole point.
#
# WHY A NEW FIXTURE AND NOT planet_surface. The surface cell stands at
# 27.99 N with a 4.7 km horizon, and the albedo raster's texel is 19.5 km
# across -- so the raster contributes ONE COLOUR to that entire frame and
# cannot be seen to be right or wrong there. Everything #300 claims about
# land cover is a claim at a scale only an orbital camera reaches.
#
# WHAT THIS CELL PINS. The whole illuminated disc, so the claim under test
# is the acceptance criterion itself -- that the planet is RECOGNISABLE:
#
#   * the equatorial and monsoon belts read GREEN, because chlorophyll
#     absorbs at 430 and 662 nm;
#   * Arabia, Iran and the Thar read TAN, because iron oxide absorbs toward
#     the blue and MODIS band 1 exceeds band 4 exceeds band 3 there;
#   * the coastlines are where the DEM's own sign change puts them, because
#     the raster's coverage mask is derived from that grid and not from the
#     imagery.
#
# A pre-#300 render of this camera is a uniformly lit sphere of one albedo.
#
# WHY 30 000 km AND NOT 400. Two reasons, and the second is the honest one.
#
#   1. At 400 km the frame spans a few hundred kilometres and the raster's
#      texel is 19.5 km, so a texel covers ~50 pixels: the cell would be
#      measuring the interpolation rather than the land cover.
#   2. At 400 km the LOD selector converges to level 2 over the whole globe
#      and what the ray actually meets is the P3 analytic body rather than
#      the chunks -- measured, by the fact that r_planet_ground_albedo moves
#      that frame and r_planet_snowline does not. #300 puts the raster on
#      the analytic body precisely so that view is not blank, but the
#      SLOPE and SNOWLINE modulation cannot apply to a sphere, so a 400 km
#      cell would pin only half the phase. From full-disc range the raster
#      is sub-pixel and none of that is in question.
#
# The surface half of the phase -- slope-driven rock and the
# latitude-derived snowline -- is pinned by planet_surface and by
# tests/pt_planet_albedo_test.cpp, which measures both against published
# equilibrium-line altitudes and threshold hillslopes.
#
# WHY NOT THE PLANETARY OCEAN. r_planet_ocean puts a shell at the SEA-LEVEL
# radius, and with terrain streaming the analytic body sits ~28 km below
# that -- so the shell covers the entire body and the frame becomes one
# specular sphere. Instead r_planet_ground_albedo carries deep water's own
# measured 0.06 (Budyko 1974), which is what the uncovered part of the
# raster is.
#
# Parser-safety: no semicolons or backticks anywhere in this file, comments
# included. The console splits scripts on both newline AND semicolon.

app_window_width 512
app_window_height 384

r_scene_default earth

# 30 000 km, straight down over the reference site. The whole illuminated
# disc fits in a 40-degree field, which is what makes this an acceptance
# shot rather than a landscape.
cam_pos 0 30000000 0
r_planet_stand_eye -1
cam_yaw 0
cam_pitch -90
cam_fov 40

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_site_lat 27.9881
r_planet_site_lon 86.9250
r_planet_lod_error_px 1.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 13
r_planet_chunk_budget 2048
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

# Land cover, stated rather than inherited so this fixture declares the
# thing it exists to test.
r_planet_albedo_map assets/planet/earth_lite.ptalb
r_planet_land_albedo 1
r_planet_snowline 4900

# Deep water's own measured diffuse reflectance, 0.06 (Budyko 1974,
# "Climate and Life"). This is what the analytic body shows wherever the
# raster has no coverage, which is exactly the ocean -- so it is a real
# value for a real surface rather than a backdrop colour.
r_planet_ground_albedo 0.06

# Sun overhead at the site, so the land cover -- not the shading -- is what
# varies across the frame. A low sun would put most of the disc under a
# grazing cosine and hide the albedo differences this cell is about.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 90
r_sun_azimuth 0

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Land reflectance runs from rainforest's 0.02 to snow's 0.9, and the
# exposure has to keep BOTH ends on screen or the cell stops measuring land
# cover and starts measuring clipping. Higher than planet_surface's 0.01587
# because that one is pointed at snow at close range and this one is a whole
# disc most of which is 0.06 ocean.
r_exposure 0.05
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
