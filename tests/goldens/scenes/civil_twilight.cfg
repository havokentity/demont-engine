#
# Planetary P3 (#257) acceptance fixture: the twilight zenith must read
# BLUE, not brown. That is what ozone buys, and it is the cheapest
# real-physics win in the whole atmosphere chain.
#
# The sun sits 4 degrees below the horizon -- civil twilight, the blue
# hour. A camera at eye height looks up at 55 degrees, so most of the
# frame is the part of the sky the effect is named for.
#
# WHY THIS FIXTURE NEEDS r_sun_physical_transmittance 1. Ozone lives at
# 25 km. A camera-to-surface ray at eye height never climbs anywhere
# near it -- a 50 km near-horizontal ray tops out around 200 m -- so the
# aerial-perspective integral cannot see the layer at all. SUNLIGHT
# crosses it at a grazing angle, and does so for a very long way at
# twilight, which is exactly why the blue hour exists. The only path in
# this engine that carries that geometry is the sun's slant-path
# transmittance, and until #257 that was a hand-tuned grey exponential
# with an authored RGB lerp on top. So this fixture turns the physical
# path on, and its A/B counterpart (civil_twilight_no_ozone.cfg) turns
# ozone off and nothing else.
#
# Parser-safety: no semicolons or backticks anywhere in this file
# (including comments). The engine console splits scripts on both
# newline AND semicolon, even inside hash-prefixed comment lines.

app_window_width 512
app_window_height 384

cam_pos 0 1.7 0
cam_yaw -90
cam_pitch 55
cam_fov 60

# No default primitives -- this fixture is about the sky.
pt_smoke_skip_prim_seed 1
pt_smoke_skip_csg_seed 1

r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation -4
r_sun_azimuth 90

# Physical sunlight: the reddening comes from the real slant-path
# optical depth rather than from exp(-0.30 / sin(elevation)) times an
# authored colour ramp.
r_sun_physical_transmittance 1

# The medium at its real settings, pinned in the fixture rather than
# inherited so this golden cannot silently re-render when a default
# moves.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 32
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0

r_clouds 0

r_spp 4
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 8.0

r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1

# --- Planetary P4 (#258) ---
# Pin the seeded scene. The engine's r_scene_default flipped to `earth` in
# #258, so every fixture that renders the historical three-spheres-plus-
# drilled-cube arrangement -- or that relies on the seed being suppressed
# by its own pt_smoke_skip_* lines -- states which scene it wants rather
# than inheriting a default that has now moved once and could move again.
# Stating it here is what made that switch cost zero regenerated goldens.
r_scene_default spheres_csg
