#
# Planetary P4 (#258) acceptance fixture: the same planet from 4 km.
#
# The scale counterpart to planet_surface.cfg. Same engine, same TLAS, same
# ray query, same chunk representation -- the only difference between the
# two cells is where the camera is and therefore which levels the LOD
# selector chose. There is no second code path for "aerial mode", and that
# is the claim this pair exists to pin.
#
# WHY 4 km AND NOT 400 km
#
# The phase's stated acceptance includes "fly to orbit and see a coherent
# globe". The GEOMETRY half of that works -- at 3.0e7 m the streamer serves
# the six root chunks, the anchor engages, the instance transforms stay
# camera-relative and the disc has a clean limb. The SHADING half does not,
# and not because of anything in this phase: rendering the P3 analytic
# planet body from outside the atmosphere produces a black disc on
# UNMODIFIED main too (reproduce with r_planet_ground 1 and cam_pos
# 0 30000000 0). The sky-view path is a function of the camera and does not
# survive leaving the shell -- which is exactly what the roadmap says, and
# exactly what P6 owns. A golden of a black disc would pin a bug.
#
# So this cell goes as high as the atmosphere is currently valid. It still
# exercises what P4 is responsible for: several LOD levels in one frame,
# the coarse end of the range, and a horizon that has to be continuous
# across every level boundary between here and 220 km away.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

r_scene_default earth

# ALTITUDE IS RELATIVE TO THE TERRAIN, NOT TO THE ELLIPSOID.
#
# r_planet_stand_eye places the camera this far above the ground on the
# first live terrain frame. Writing an absolute cam_pos y instead is a trap
# that this fixture fell into once: the numbers were tuned against the
# procedural fallback, where the reference site sits at 1 080 m, and the
# real ETOPO grid puts the same site (Everest) at 6 264 m -- so the camera
# ended up inside the mountain and the capture was a black frame. An
# altitude above the SURFACE means the same thing whatever the elevation
# field says.
#
# 4 km above the terrain, looking down and out at 25 degrees.
cam_pos 0 0 0
r_planet_stand_eye 4000
cam_yaw -90
cam_pitch -25
cam_fov 55

r_planet_terrain 1
r_planet_spherical_frame 1
r_planet_ground 1
r_planet_lod_error_px 0.5
r_planet_lod_hysteresis 1.4
r_planet_lod_max_level 11
r_planet_chunk_budget 2048
r_planet_workers 4
r_planet_blas_budget_ms 0
r_planet_lod_freeze 1
pt_planet_settle_rounds 256

r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation 25
r_sun_azimuth 200

r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

r_spp 2
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
# Snow is albedo ~0.85 (Budyko 1974); the 0.4 here was tuned against the
# 0.18-albedo procedural fallback and blows the real Himalaya out to white.
# 0.09 is that 0.4 divided by the albedo ratio, so the surface lands back
# in range and the geometry is visible -- which is what a golden has to
# pin.
r_exposure 0.09

r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
