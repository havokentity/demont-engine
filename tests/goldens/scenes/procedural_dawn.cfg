# Golden-image regression matrix (issue #112) -- civil-twilight scene.
# Sun at -2 degrees (just below horizon). Exercises:
#   * Sun-below-horizon math (no visible sun disc, but sky still lit)
#   * Civil-twilight horizon glow
#   * Sky-without-sun-disc branch in PathTrace.slang
#   * Exposure on a dim but non-zero sky
#
# Parser caveat: console splits on newline and semicolon even inside
# comments. ASCII only, no semicolons or backticks.

app_window_width 512
app_window_height 384

# Camera looks east-ish at horizon. Sun azimuth 90 = east -- yaw 90
# points the camera in that direction. Pitch slightly up.
cam_pos 0 1.5 4
cam_yaw 90
cam_pitch 8
cam_fov 60

# Sky: manual procedural. Sun at -2 deg = "civil dawn" -- sun just
# below the horizon, sky still has horizon glow but no sun disc.
r_sky_mode procedural
r_sky_use_astronomical 0
r_sun_elevation -2
r_sun_azimuth 90

r_spp 1
r_max_bounces 2
r_firefly_clamp 10
r_caustics 0
r_refract_bounces 1
r_accum_ema_alpha 0
r_svgf_atrous_passes 3
r_hdr_pipeline 1

# Manual exposure, brighter than evening since the scene is dimmer.
r_auto_exposure 0
# #280: metered; a dawn sky is ~44x dimmer than noon, which is the eye's job.
# Auto-exposure carries this scene without any manual value at all
# now that the sky is in real radiometric units; the fixture pins the
# metered result rather than enabling auto-exposure, because a golden
# has to be deterministic and an A/B pair has to share one exposure.
r_exposure 0.6746
# Bloom still on (sky horizon glow has its own dim HDR signature).
r_bloom 1
r_lens_flare 0

# Stars off so this fixture isolates the sky-without-stars dawn glow
# behaviour. r_star_split 0 only skips the post-denoise composite,
# while the in-shader starsOnly() helper still fires whenever
# r_show_stars=1 (default) and the day-fade gate
# day = smoothstep(-0.10, 0.20, sin(sun_elev)) is below 0.6 -- which
# is true at sun elevation -2 deg. r_show_stars 0 is the only switch
# that truly silences both the procedural and BSC star paths.
r_show_stars 0
r_stars_aperture_samples 16
r_star_split 0
r_dof 0
r_clouds 0

r_capture_format png
r_capture_seed 1

# --- Planetary P4 (#258) ---
# Pin the seeded scene. The engine's r_scene_default flipped to `earth` in
# #258, so every fixture that renders the historical three-spheres-plus-
# drilled-cube arrangement -- or that relies on the seed being suppressed
# by its own pt_smoke_skip_* lines -- states which scene it wants rather
# than inheriting a default that has now moved once and could move again.
# Stating it here is what made that switch cost zero regenerated goldens.
r_scene_default spheres_csg
