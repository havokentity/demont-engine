#
# Planetary P5 (#259): the Cox-Munk control for planet_ocean_orbit.cfg.
#
# Byte-for-byte planet_ocean_orbit.cfg with ONE line changed -- r_ocean 0 --
# so the FFT solver never runs, the cascades resolve nothing, and the water
# shell's microfacet alpha^2 is Cox & Munk's whole measured slope variance at
# every distance. That is a fixed roughness sphere, and it is exactly what a
# wave field seen from far enough away IS.
#
# The pair is the phase's acceptance criterion, and it is a real test rather
# than a restatement because the two frames are produced by DIFFERENT
# machinery: one integrates a synthesised height field through a ray-march
# and folds the sub-footprint remainder into the BRDF, the other has no
# height field at all. They agree only if the handover conserves what it is
# supposed to conserve.
#
# THE VACUITY GUARD. Both halves must contain the glitter -- two black frames
# also agree. planet_ocean_orbit.cfg is pinned against its own committed PNG
# for that reason, so "they match" and "they show an ocean" are two separate
# assertions and neither can stand in for the other.
#
# Parser-safety: no semicolons or backticks anywhere in this file.

app_window_width 512
app_window_height 384

# The planet IS the scene, but only the water half of it.
r_scene_default earth
pt_smoke_skip_csg_seed 1
pt_smoke_skip_prim_seed 1

r_planet_terrain 0
r_planet_spherical_frame 1
r_planet_ground 0
r_planet_ocean 1
r_planet_radius 6371008.8

# 400 km: the altitude of the International Space Station, and the altitude
# the roadmap's headline climb ends at. Pitched 60 degrees down so the
# specular point sits inside the frame rather than beyond the limb.
cam_pos 0 400000 0
cam_yaw 0
cam_pitch -60
cam_fov 60

# The sun 60 degrees up, so the specular point is under the camera and the
# glitter patch is the subject of the frame. At this footprint -- 2 460 m per
# pixel -- every cascade is unresolved and alpha^2 is exactly Cox & Munk's
# sigma^2 for 12 m/s, i.e. alpha 0.2539, i.e. an engine roughness of 0.5038.
r_sky_mode physical
r_sky_use_astronomical 0
r_sun_elevation 60
r_sun_azimuth 0

# The atmosphere at its real P3 settings, stated rather than inherited.
r_volumetric 1
r_volumetric_anisotropy 0.7
r_volumetric_intensity 1.0
r_volumetric_samples 16
r_rayleigh 1.0
r_volumetric_density 3.996e-6
r_ozone 1.0
r_clouds 0

# The FFT. 12 m/s is a fresh breeze (Beaufort 6) and is the wind Cox & Munk's
# sigma^2 = 0.003 + 0.00512 U is quoted at throughout this phase.
r_ocean 0
r_ocean_wind_speed 12
r_ocean_wind_dir_deg 0
r_ocean_choppiness 1.0
r_ocean_grid_size 256
r_ocean_march_steps 64
r_ocean_foam_amount 1.0

# Open-ocean absorption: blue-green, red gone within a couple of metres.
r_water_absorption_r 0.40
r_water_absorption_g 0.10
r_water_absorption_b 0.05
r_water_ior 1.33

r_spp 2
r_max_bounces 3
r_firefly_clamp 8
r_caustics 0
r_accum_ema_alpha 0

r_auto_exposure 0
r_exposure 0.15

r_env_map ""
r_bloom 0
r_lens_flare 0
r_denoiser off

r_capture_format png
r_capture_seed 1
